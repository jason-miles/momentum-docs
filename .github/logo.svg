<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-label="Momentum Health">
  <rect width="760" height="300" rx="16" fill="#ffffff"/>
  <!-- "momentum" — leading m in red, remainder in navy -->
  <text x="380" y="150"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="150" font-weight="700" letter-spacing="-4"
        text-anchor="middle" fill="#00205B">
    <tspan fill="#E4002B">m</tspan><tspan>omentum</tspan>
  </text>
  <!-- "health" — navy, lighter weight, centered under -->
  <text x="380" y="248"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="92" font-weight="400" letter-spacing="6"
        text-anchor="middle" fill="#00205B">health</text>
</svg>
